info:
  name: Create random Challenge
  type: http
  seq: 3

http:
  method: POST
  url: "{{domain_url}}/admin/daily/generate-answer?date=2026-05-26"
  params:
    - name: date
      value: 2026-05-26
      type: query
  auth:
    type: bearer
    token: "{{admin_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
