name: Backend - Build & test 

on:
  push:  # push on master with changes in this file or in backend folder
    branches: [ "master" ]
    paths:
    - '.github/workflows/test-backend.yml'
    - 'src/monhundle/**'
  pull_request: # all PR targeting master
    branches: [ "master" ]
  workflow_dispatch: # enable manual execution
  release:
    types: [published]  # Déclenche le workflow quand une release est publiée

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # dotnet looks for global.json from the directory it runs in, not from the project it builds
        working-directory: ./src/monhundle

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ./src/monhundle/global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Unit Tests
      run: dotnet test ./MonHundle.Tests/MonHundle.Tests.csproj --no-build --verbosity normal

    - name: Integration Tests
      run: dotnet test ./MonHundle.IntegrationTests/MonHundle.IntegrationTests.csproj --no-build --verbosity normal

  update-docker:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/monhundle

    steps:
      - uses: actions/checkout@v5

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_AUTH_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push docker image
        run: |
          docker build -t brycur/monhundle:${{ vars.DOCKER_VERSION_TAG}} .
          docker tag brycur/monhundle:${{ vars.DOCKER_VERSION_TAG}} brycur/monhundle:latest
          docker push brycur/monhundle:${{ vars.DOCKER_VERSION_TAG}}
          docker push brycur/monhundle:latest


